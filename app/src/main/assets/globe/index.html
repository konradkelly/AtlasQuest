<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive 3D World Map</title>
<!--
  AtlasQuest globe. Adapted from the standalone artifact:
    - script/data sources point at bundled offline assets (no CDN, no network)
    - the "Explore" button calls the native bridge (AtlasQuest.onContinentSelected)
      so tapping a continent hands off to the native sub-region map + quiz.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    background: #0a1628;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #map-container { position: fixed; inset: 0; }
  #globe-wrap {
    position: fixed; inset: 0; overflow: hidden; background: #0a1628;
  }
  canvas#globe { width: 100%; height: 100%; display: block; }
  #region-panel {
    position: absolute; top: 16px; right: 16px;
    background: rgba(10,22,40,0.92); backdrop-filter: blur(8px);
    border-radius: 16px; border: 1px solid rgba(255,255,255,0.12);
    padding: 16px 20px; width: 200px; color: #fff;
    transition: opacity 0.3s, transform 0.3s;
    opacity: 0; transform: translateY(8px) scale(0.97); pointer-events: none;
  }
  #region-panel.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  #region-panel h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; color: #fff; }
  #region-panel .sub { font-size: 12px; color: rgba(255,255,255,0.55); margin-bottom: 12px; }
  #region-panel .stat { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #region-panel .stat-label { font-size: 12px; color: rgba(255,255,255,0.6); }
  #region-panel .stat-val { font-size: 13px; font-weight: 500; color: #58CC02; }
  #xp-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
    background: #58CC02; border-radius: 20px; padding: 8px 16px;
    font-size: 13px; font-weight: 500; color: #fff; cursor: pointer; transition: transform 0.15s;
  }
  #xp-badge:hover { transform: scale(1.04); }
  .region-chip {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 20px; padding: 5px 14px; font-size: 12px; color: rgba(255,255,255,0.7);
    cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s; white-space: nowrap;
  }
  .region-chip:hover { background: rgba(88,204,2,0.18); border-color: #58CC02; color: #58CC02; }
  .region-chip.active { background: #58CC02; border-color: #58CC02; color: #fff; }
  #chips {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto;
    max-width: calc(100% - 32px); padding-bottom: 2px;
  }
  #hint {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,0.35); white-space: nowrap;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="map-container">
  <h2 class="sr-only">Interactive 3D world map with clickable continents</h2>
  <div id="globe-wrap">
    <canvas id="globe"></canvas>
    <div id="region-panel">
      <div id="rp-emoji" style="font-size:28px; margin-bottom:8px;">🌍</div>
      <h3 id="rp-name">Region</h3>
      <div class="sub" id="rp-sub">Click to explore</div>
      <div class="stat"><span class="stat-label">Countries</span><span class="stat-val" id="rp-countries">-</span></div>
      <div class="stat"><span class="stat-label">Population</span><span class="stat-val" id="rp-pop">-</span></div>
      <div class="stat"><span class="stat-label">Area</span><span class="stat-val" id="rp-area">-</span></div>
      <div id="xp-badge">⚡ Explore region</div>
    </div>
    <div id="hint">tap a continent or use buttons below</div>
    <div id="chips"></div>
  </div>
</div>

<script src="d3.min.js"></script>
<script src="topojson.min.js"></script>
<script>
/* REGION DEFINITIONS — ISO 3166-1 numeric codes, plain decimals (no octal!). */
const NA = [124,840,484,320,84,340,222,558,188,591,192,388,332,214,630,780,44,52,662,308,28,212,659,670,533,531,304];
const SA = [32,68,76,152,170,218,328,600,604,740,858,862];
const EU = [8,20,40,112,56,70,100,191,196,203,208,233,246,250,276,300,348,352,372,380,383,428,438,440,442,470,498,492,499,528,807,578,616,620,642,643,674,688,703,705,724,752,756,804,826,336];
const AF = [12,24,204,72,854,108,132,120,140,148,174,178,180,262,818,226,232,748,231,266,270,288,324,624,384,404,426,430,434,450,454,466,478,480,504,508,516,562,566,646,678,686,690,694,706,710,728,729,834,768,788,800,894,716];
const AS = [4,51,31,48,50,64,96,116,156,268,356,360,364,368,376,392,400,398,414,417,418,422,458,462,496,104,524,408,512,586,275,608,634,682,702,410,144,760,158,762,764,626,792,795,784,860,704,887];
const OC = [36,242,296,584,583,520,554,585,598,882,90,776,798,548,316,580,16,258,540];

const REGIONS = {
  "North America": { emoji:"🌎", color:"#FFB020", countries:23, pop:"592M", area:"24.7M km²", chip:"N. America", ids: new Set(NA) },
  "South America": { emoji:"🌎", color:"#58CC02", countries:12, pop:"434M", area:"17.8M km²", chip:"S. America", ids: new Set(SA) },
  "Europe":        { emoji:"🌍", color:"#1CB0F6", countries:44, pop:"748M", area:"10.5M km²", chip:"Europe",    ids: new Set(EU) },
  "Africa":        { emoji:"🌍", color:"#FF4B4B", countries:54, pop:"1.4B", area:"30.3M km²", chip:"Africa",    ids: new Set(AF) },
  "Asia":          { emoji:"🌏", color:"#FF9600", countries:48, pop:"4.7B", area:"44.6M km²", chip:"Asia",      ids: new Set(AS) },
  "Oceania":       { emoji:"🌏", color:"#CE82FF", countries:14, pop:"44M",  area:"8.5M km²",  chip:"Oceania",   ids: new Set(OC) },
};

const COUNTRY_TO_REGION = {};
Object.entries(REGIONS).forEach(([rname, rd]) => {
  rd.ids.forEach(id => { if (!COUNTRY_TO_REGION[id]) COUNTRY_TO_REGION[id] = rname; });
});

// Some features in the 110m dataset have no numeric ISO id (disputed/partial
// recognition). Map them to a region by name so they color correctly.
const NAME_OVERRIDE = { "Somaliland": "Africa", "N. Cyprus": "Europe", "Kosovo": "Europe" };
function regionForFeature(f) {
  return COUNTRY_TO_REGION[+f.id] || NAME_OVERRIDE[f.properties && f.properties.name] || null;
}

const canvas = document.getElementById('globe');
const wrap = document.getElementById('globe-wrap');
let W, H, ctx, projection, path, worldData;
let selectedRegion = null, hoverRegion = null, animFrame = {};
let rotation = [10, -20];
let dragging = false, dragStart, rotStart;
let autoRotate = true;
let particles = [];
let spin = null;              // active rotate-to-region tween
const _centroidCache = {};

function resize() {
  // Size straight from the viewport — robust inside a WebView where percentage
  // height chains can collapse to zero.
  W = window.innerWidth || wrap.offsetWidth;
  H = window.innerHeight || wrap.offsetHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  ctx = canvas.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const r = Math.min(W, H) * 0.42;
  projection = d3.geoOrthographic().scale(r).translate([W/2, H/2]).clipAngle(90).rotate(rotation);
  path = d3.geoPath(projection, ctx);
}

function init() {
  // Render the spinning sphere immediately; countries appear once data loads.
  resize(); buildChips(); loop();
  loadData();
}

function loadData() {
  // XMLHttpRequest (not fetch) honors allowFileAccessFromFileURLs for file:// assets.
  const xhr = new XMLHttpRequest();
  xhr.open('GET', 'countries-110m.json', true);
  xhr.onload = function () {
    if (xhr.status === 200 || xhr.status === 0) {
      try { worldData = JSON.parse(xhr.responseText); }
      catch (e) { console.error('Failed to parse country data:', e); }
    } else {
      console.error('Country data load failed, status:', xhr.status);
    }
  };
  xhr.onerror = function () { console.error('Country data request errored'); };
  xhr.send();
}

function getRegionColor(rname, alpha=1, bright=false) {
  if (!rname) return `rgba(30,60,100,${alpha})`;
  const c = REGIONS[rname].color;
  const r=parseInt(c.slice(1,3),16), g=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16);
  if (bright) return `rgba(${Math.min(r+60,255)},${Math.min(g+60,255)},${Math.min(b+60,255)},${alpha})`;
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawGlobe() {
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, r=projection.scale();

  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#0d1f3c'; ctx.fill();
  const grd=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,0,cx,cy,r);
  grd.addColorStop(0,'rgba(255,255,255,0.04)'); grd.addColorStop(1,'rgba(0,0,30,0.5)');
  ctx.fillStyle=grd; ctx.fill(); ctx.restore();

  if (!worldData) return;
  const countries = topojson.feature(worldData, worldData.objects.countries);
  countries.features.forEach(f => {
    const rname = regionForFeature(f);
    const isSelected = rname && rname === selectedRegion;
    const isHover = rname && rname === hoverRegion;
    const t = animFrame[rname] || 0;
    ctx.beginPath(); path(f);
    if (isSelected) {
      ctx.save();
      ctx.shadowColor = REGIONS[rname].color;
      ctx.shadowBlur = 18 + Math.sin(t*0.05)*8;
      ctx.fillStyle = getRegionColor(rname, 0.85 + Math.sin(t*0.07)*0.12);
      ctx.strokeStyle = getRegionColor(rname, 1, true);
      ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke(); ctx.restore();
    } else if (isHover) {
      ctx.fillStyle = getRegionColor(rname, 0.7);
      ctx.strokeStyle = getRegionColor(rname, 0.9, true);
      ctx.lineWidth = 1; ctx.fill(); ctx.stroke();
    } else if (rname) {
      ctx.fillStyle = getRegionColor(rname, 0.35);
      ctx.strokeStyle = getRegionColor(rname, 0.5);
      ctx.lineWidth = 0.5; ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle='rgba(20,45,80,0.6)';
      ctx.strokeStyle='rgba(255,255,255,0.05)';
      ctx.lineWidth=0.3; ctx.fill(); ctx.stroke();
    }
  });

  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1; ctx.stroke();
  const shd=ctx.createRadialGradient(cx+r*0.6,cy-r*0.5,0,cx,cy,r);
  shd.addColorStop(0,'rgba(255,255,255,0.12)'); shd.addColorStop(0.4,'rgba(255,255,255,0.0)'); shd.addColorStop(1,'rgba(0,0,0,0.25)');
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=shd; ctx.fill(); ctx.restore();

  particles.forEach(p => {
    p.life--; p.x+=p.vx; p.y+=p.vy; p.vy-=0.04;
    if (p.life>0) {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,Math.PI*2);
      ctx.fillStyle=`rgba(${p.cr},${p.cg},${p.cb},${p.life/p.maxLife*0.8})`; ctx.fill();
    }
  });
  particles = particles.filter(p=>p.life>0);
}

function spawnParticles(cx,cy,color) {
  const r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);
  for (let i=0;i<30;i++) {
    const angle=Math.random()*Math.PI*2, speed=Math.random()*3+1;
    particles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2,
      r:Math.random()*4+2,life:Math.random()*40+20,maxLife:60,cr:r,cg:g,cb:b});
  }
}

function loop() {
  Object.keys(animFrame).forEach(k=>animFrame[k]++);
  if (spin) {
    spin.t++;
    const k = Math.min(spin.t / spin.dur, 1);
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;   // easeInOutQuad
    rotation[0] = spin.from[0] + (spin.to[0]-spin.from[0])*e;
    rotation[1] = spin.from[1] + (spin.to[1]-spin.from[1])*e;
    projection.rotate(rotation);
    if (k >= 1) spin = null;
  } else if (autoRotate && !dragging && !selectedRegion) {
    rotation[0]+=0.15; projection.rotate(rotation);
  }
  drawGlobe();
  requestAnimationFrame(loop);
}

// Geographic centroid [lon,lat] of all countries in a region (cached).
function regionCentroid(rname) {
  if (_centroidCache[rname]) return _centroidCache[rname];
  if (!worldData) return null;
  const countries = topojson.feature(worldData, worldData.objects.countries);
  const feats = countries.features.filter(f => regionForFeature(f) === rname);
  if (!feats.length) return null;
  const c = d3.geoCentroid({ type: 'FeatureCollection', features: feats });
  _centroidCache[rname] = c;
  return c;
}

// Start a tween that rotates the region's centroid to face the viewer.
function rotateToRegion(rname) {
  const c = regionCentroid(rname);
  if (!c) return;
  const from = rotation.slice();
  // Centering on (lon,lat) means rotation = [-lon, -lat]; take the shortest yaw path.
  let dyaw = ((-c[0] - from[0] + 540) % 360) - 180;
  spin = { from: from, to: [from[0] + dyaw, -c[1]], t: 0, dur: 45 };
}

function selectRegion(rname) {
  if (selectedRegion===rname) {
    selectedRegion=null;
    document.getElementById('region-panel').classList.remove('visible');
    document.querySelectorAll('.region-chip').forEach(c=>c.classList.remove('active'));
    autoRotate=true; return;
  }
  if (selectedRegion) animFrame[selectedRegion]=0;
  selectedRegion=rname; animFrame[rname]=0; autoRotate=false;
  const rd=REGIONS[rname];
  document.getElementById('rp-emoji').textContent=rd.emoji;
  document.getElementById('rp-name').textContent=rname;
  document.getElementById('rp-sub').textContent='Top region';
  document.getElementById('rp-countries').textContent=rd.countries;
  document.getElementById('rp-pop').textContent=rd.pop;
  document.getElementById('rp-area').textContent=rd.area;
  document.getElementById('region-panel').classList.add('visible');
  document.querySelectorAll('.region-chip').forEach(c=>{ c.classList.toggle('active', c.dataset.region===rname); });
  spawnParticles(W/2,H/2,rd.color);
  rotateToRegion(rname);
}

function getMouseRegion(e) {
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*devicePixelRatio, my=(e.clientY-rect.top)*devicePixelRatio;
  if (!worldData) return null;
  const countries=topojson.feature(worldData,worldData.objects.countries);
  for (const f of countries.features) {
    ctx.beginPath(); path(f);
    if (ctx.isPointInPath(mx,my)) return regionForFeature(f);
  }
  return null;
}

canvas.addEventListener('mousedown',e=>{spin=null;dragging=true;dragStart=[e.clientX,e.clientY];rotStart=[...rotation];});
canvas.addEventListener('mousemove',e=>{
  if (dragging) {
    const dx=e.clientX-dragStart[0],dy=e.clientY-dragStart[1];
    rotation[0]=rotStart[0]+dx*0.3; rotation[1]=Math.max(-60,Math.min(60,rotStart[1]-dy*0.3));
    projection.rotate(rotation);
  } else { hoverRegion=getMouseRegion(e); canvas.style.cursor=hoverRegion?'pointer':'grab'; }
});
canvas.addEventListener('mouseup',e=>{
  if (dragging&&Math.abs(e.clientX-dragStart[0])<4&&Math.abs(e.clientY-dragStart[1])<4) {
    const r=getMouseRegion(e); if (r) selectRegion(r);
  }
  dragging=false;
});
canvas.addEventListener('mouseleave',()=>{dragging=false;hoverRegion=null;});
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];spin=null;dragging=true;dragStart=[t.clientX,t.clientY];rotStart=[...rotation];},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!dragging)return;const t=e.touches[0];
  const dx=t.clientX-dragStart[0],dy=t.clientY-dragStart[1];
  rotation[0]=rotStart[0]+dx*0.3; rotation[1]=Math.max(-60,Math.min(60,rotStart[1]-dy*0.3));
  projection.rotate(rotation);
},{passive:true});
canvas.addEventListener('touchend',e=>{
  // tap (not drag) selects, mirroring the mouse path
  if (dragging && dragStart) {
    const ch = e.changedTouches[0];
    if (ch && Math.abs(ch.clientX-dragStart[0])<6 && Math.abs(ch.clientY-dragStart[1])<6) {
      const r=getMouseRegion({clientX:ch.clientX, clientY:ch.clientY}); if (r) selectRegion(r);
    }
  }
  dragging=false;
  // Suppress the synthesized mouse events a tap would otherwise fire, which would
  // call selectRegion() a second time and immediately toggle the panel back off.
  if (e.cancelable) e.preventDefault();
});

// Hand off to the native app: launch the selected continent's sub-region map + quiz.
document.getElementById('xp-badge').addEventListener('click',()=>{
  if (!selectedRegion) return;
  if (window.AtlasQuest && window.AtlasQuest.onContinentSelected) {
    window.AtlasQuest.onContinentSelected(selectedRegion);
  } else {
    console.log('Explore region:', selectedRegion);
  }
});

function buildChips() {
  const chips=document.getElementById('chips');
  Object.entries(REGIONS).forEach(([rname,rd])=>{
    const el=document.createElement('div');
    el.className='region-chip'; el.dataset.region=rname; el.textContent=rd.chip;
    el.addEventListener('click',()=>selectRegion(rname));
    chips.appendChild(el);
  });
}

window.addEventListener('resize',resize);
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subregion Globe</title>
<!--
  AtlasQuest subregion globe. A trimmed sibling of index.html: it stays locked on
  a single continent (no rotate, no drag, no auto-spin) and colours that
  continent's SUBREGIONS instead of continents. Config (which countries belong to
  which subregion) is injected by the native host via AtlasQuest.getConfigJson().
  Tapping a subregion highlights it and opens an in-page "take a quiz?" modal
  (styled like index.html's region panel). Confirming there calls
  AtlasQuest.onQuizConfirmed(regionId), which hands off to the native quiz.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body { background: #0a1628; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #globe-wrap { position: fixed; inset: 0; overflow: hidden; background: #0a1628; }
  canvas#globe { width: 100%; height: 100%; display: block; touch-action: none; }
  #hint {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,0.4); white-space: nowrap; pointer-events: none;
  }
  /* "Take a quiz?" modal — same glassy dark card / green accent as index.html. */
  #quiz-modal {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,12,24,0.45); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  #quiz-modal.visible { opacity: 1; pointer-events: auto; }
  #quiz-modal .card {
    background: rgba(10,22,40,0.95); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; padding: 24px 28px; width: min(82%, 320px); text-align: center; color: #fff;
    transform: translateY(8px) scale(0.97); transition: transform 0.25s;
  }
  #quiz-modal.visible .card { transform: translateY(0) scale(1); }
  #quiz-modal .qm-emoji { font-size: 34px; margin-bottom: 10px; }
  #quiz-modal h3 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  #quiz-modal .qm-sub { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
  #quiz-modal .qm-actions { display: flex; gap: 12px; justify-content: center; }
  #quiz-modal .qm-cancel {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 20px; padding: 10px 18px; font-size: 14px; color: rgba(255,255,255,0.75); cursor: pointer;
  }
  #quiz-modal .qm-start {
    background: #58CC02; border-radius: 20px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; transition: transform 0.15s;
  }
  #quiz-modal .qm-start:hover { transform: scale(1.04); }
</style>
</head>
<body>
<div id="globe-wrap">
  <canvas id="globe"></canvas>
  <div id="hint">tap a region to start a quiz</div>
  <div id="quiz-modal">
    <div class="card">
      <div class="qm-emoji">🧭</div>
      <h3 id="qm-name">Region</h3>
      <div class="qm-sub">Take a quiz on this region?</div>
      <div class="qm-actions">
        <div id="qm-cancel" class="qm-cancel">Not now</div>
        <div id="qm-start" class="qm-start">⚡ Start quiz</div>
      </div>
    </div>
  </div>
</div>

<script src="d3.min.js"></script>
<script src="topojson.min.js"></script>
<script>
const canvas = document.getElementById('globe');
let W, H, ctx, projection, path, worldData;
let SUBREGIONS = [];          // [{id,name,color}]
const NUM = {};               // numeric id (string) -> subregion
const NAME = {};              // properties.name      -> subregion
let continentFC = null;       // FeatureCollection of this continent's countries
let selectedId = null, animT = 0;
let loading = false;          // true between tap and modal: drives the loading ring
const _boundaryCache = {};    // subregion id -> merged outline geometry

// --- config injected by the native host -------------------------------------
function loadConfig() {
  try {
    const json = (window.AtlasQuest && window.AtlasQuest.getConfigJson)
      ? window.AtlasQuest.getConfigJson() : '{"subregions":[]}';
    const cfg = JSON.parse(json);
    SUBREGIONS = cfg.subregions || [];
    SUBREGIONS.forEach(s => {
      (s.numericIds || []).forEach(id => { NUM[String(id)] = s; });
      (s.names || []).forEach(n => { NAME[n] = s; });
    });
  } catch (e) { console.error('config parse failed', e); }
}

function subregionForFeature(f) {
  return NUM[String(f.id)] || (f.properties && NAME[f.properties.name]) || null;
}

// Merge a subregion's countries into a single outline (dissolving internal
// borders) so the loading ring sweeps the whole region, not each country.
function subregionBoundary(sub) {
  if (_boundaryCache[sub.id]) return _boundaryCache[sub.id];
  if (!worldData) return null;
  const geoms = worldData.objects.countries.geometries.filter(g => {
    const s = NUM[String(g.id)] || (g.properties && NAME[g.properties.name]) || null;
    return s && s.id === sub.id;
  });
  if (!geoms.length) return null;
  const merged = topojson.merge(worldData, geoms);
  _boundaryCache[sub.id] = merged;
  return merged;
}

// --- sizing / projection ----------------------------------------------------
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  ctx = canvas.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);
  projection = d3.geoOrthographic().clipAngle(90);
  path = d3.geoPath(projection, ctx);
  fitToContinent();
}

// Centre the continent and scale it to fill the canvas, then leave it frozen.
function fitToContinent() {
  if (!projection) return;
  if (continentFC && continentFC.features.length) {
    const c = d3.geoCentroid(continentFC);
    projection.rotate([-c[0], -c[1]]);
    const pad = Math.min(W, H) * 0.08;
    projection.fitExtent([[pad, pad], [W - pad, H - pad]], continentFC);
  } else {
    projection.scale(Math.min(W, H) * 0.42).translate([W / 2, H / 2]);
  }
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}
function brighten(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${Math.min(r + 60, 255)},${Math.min(g + 60, 255)},${Math.min(b + 60, 255)},${a})`;
}

function draw() {
  if (!ctx) return;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, r = projection.scale();

  // Ocean sphere
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#0d1f3c'; ctx.fill();
  const grd = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
  grd.addColorStop(0, 'rgba(255,255,255,0.04)'); grd.addColorStop(1, 'rgba(0,0,30,0.5)');
  ctx.fillStyle = grd; ctx.fill(); ctx.restore();

  if (worldData) {
    const countries = topojson.feature(worldData, worldData.objects.countries);
    countries.features.forEach(f => {
      const sub = subregionForFeature(f);
      ctx.beginPath(); path(f);
      if (sub && sub.id === selectedId) {
        ctx.save();
        ctx.shadowColor = sub.color; ctx.shadowBlur = 16 + Math.sin(animT * 0.06) * 8;
        ctx.fillStyle = hexToRgba(sub.color, 0.9);
        ctx.strokeStyle = brighten(sub.color, 1); ctx.lineWidth = 1.5;
        ctx.fill(); ctx.stroke(); ctx.restore();
      } else if (sub) {
        ctx.fillStyle = hexToRgba(sub.color, 0.6);
        ctx.strokeStyle = hexToRgba(sub.color, 0.85); ctx.lineWidth = 0.6;
        ctx.fill(); ctx.stroke();
      } else {
        // Countries outside this continent — barely-there context.
        ctx.fillStyle = 'rgba(20,45,80,0.45)';
        ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 0.3;
        ctx.fill(); ctx.stroke();
      }
    });
  }

  // Rim
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1; ctx.stroke();

  // Loading ring: a lit segment sweeping the selected subregion's outline while
  // we wait to open the modal.
  if (worldData && loading && selectedId) {
    const sub = SUBREGIONS.find(s => s.id === selectedId);
    const boundary = sub && subregionBoundary(sub);
    if (boundary) {
      const len = path.measure(boundary) || 600;
      ctx.save();
      ctx.beginPath(); path(boundary);
      // faint full outline...
      ctx.lineWidth = 2; ctx.lineJoin = 'round';
      ctx.strokeStyle = hexToRgba(sub.color, 0.3); ctx.stroke();
      // ...with one bright segment travelling around it (~one lap / 0.5s @60fps).
      const lit = Math.max(len * 0.16, 24);
      ctx.setLineDash([lit, len]);
      ctx.lineDashOffset = -((animT / 30) % 1) * (len + lit);
      ctx.shadowColor = brighten(sub.color, 1); ctx.shadowBlur = 18;
      ctx.strokeStyle = brighten(sub.color, 1); ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
}

function loop() { animT++; draw(); requestAnimationFrame(loop); }

// --- tap handling (locked: no drag / rotate) --------------------------------
function regionAt(clientX, clientY) {
  if (!worldData || !ctx) return null;
  const rect = canvas.getBoundingClientRect();
  const mx = (clientX - rect.left) * devicePixelRatio;
  const my = (clientY - rect.top) * devicePixelRatio;
  const countries = topojson.feature(worldData, worldData.objects.countries);
  for (const f of countries.features) {
    if (!subregionForFeature(f)) continue;
    ctx.beginPath(); path(f);
    if (ctx.isPointInPath(mx, my)) return subregionForFeature(f);
  }
  return null;
}

let selectTimer = null;
const SELECT_DELAY_MS = 800;   // let the highlight register before the modal opens
function tap(clientX, clientY) {
  const sub = regionAt(clientX, clientY);
  if (!sub) return;
  selectedId = sub.id; animT = 0; loading = true;   // highlight + loading ring
  if (selectTimer) clearTimeout(selectTimer);
  selectTimer = setTimeout(() => { selectTimer = null; showModal(sub); }, SELECT_DELAY_MS);
}

// --- "take a quiz?" modal ---------------------------------------------------
const quizModal = document.getElementById('quiz-modal');
function showModal(sub) {
  loading = false;   // stop the loading ring; the modal is up
  document.getElementById('qm-name').textContent = sub.name;
  quizModal.classList.add('visible');
}
function hideModal() {
  quizModal.classList.remove('visible');
  loading = false;
  selectedId = null;   // drop the highlight when dismissed
}
document.getElementById('qm-start').addEventListener('click', () => {
  const id = selectedId;
  hideModal();
  if (id && window.AtlasQuest && window.AtlasQuest.onQuizConfirmed) {
    window.AtlasQuest.onQuizConfirmed(id);
  }
});
document.getElementById('qm-cancel').addEventListener('click', hideModal);
quizModal.addEventListener('click', e => { if (e.target === quizModal) hideModal(); });

let downXY = null;
canvas.addEventListener('mousedown', e => { downXY = [e.clientX, e.clientY]; });
canvas.addEventListener('mouseup', e => {
  if (downXY && Math.abs(e.clientX - downXY[0]) < 6 && Math.abs(e.clientY - downXY[1]) < 6) tap(e.clientX, e.clientY);
  downXY = null;
});
canvas.addEventListener('touchstart', e => { const t = e.touches[0]; downXY = [t.clientX, t.clientY]; }, { passive: true });
canvas.addEventListener('touchend', e => {
  const ch = e.changedTouches[0];
  if (ch && downXY && Math.abs(ch.clientX - downXY[0]) < 8 && Math.abs(ch.clientY - downXY[1]) < 8) tap(ch.clientX, ch.clientY);
  downXY = null;
  if (e.cancelable) e.preventDefault();   // swallow the synthesized mouse tap
});

// --- data load --------------------------------------------------------------
function loadData() {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', 'countries-110m.json', true);
  xhr.onload = function () {
    if (xhr.status === 200 || xhr.status === 0) {
      try {
        worldData = JSON.parse(xhr.responseText);
        const all = topojson.feature(worldData, worldData.objects.countries);
        continentFC = { type: 'FeatureCollection', features: all.features.filter(subregionForFeature) };
        fitToContinent();
      } catch (e) { console.error('country data parse failed', e); }
    } else { console.error('country data load failed', xhr.status); }
  };
  xhr.onerror = function () { console.error('country data request errored'); };
  xhr.send();
}

window.addEventListener('resize', resize);
loadConfig();
resize();
loop();
loadData();
</script>
</body>
</html>
